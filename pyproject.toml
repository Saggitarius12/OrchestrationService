[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "orchestration_service"
version = "1.0.0"
description = "Production-grade multi-agent orchestration service"
requires-python = ">=3.11"

dependencies = [
    # Web framework
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    # Database
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29.0",
    "alembic>=1.13.1",
    # Validation
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.1",
    # Redis (events + optional task queue)
    "redis[hiredis]>=5.0.4",
    # HTTP client (calling Agent Runtime Service)
    "httpx>=0.27.0",
    # Observability
    "structlog>=24.1.0",
    "python-json-logger>=2.0.7",
    # Auth / security
    "python-jose[cryptography]>=3.3.0",
    # Utilities
    "tenacity>=8.3.0",
    "orjson>=3.10.3",
    "psycopg2>=2.9.11",
    "dotenv>=0.9.9",
    "psycopg2-binary>=2.9.11",
    "celery[redis]>=5.6.3",
    "openai>=2.30.0",
    "simpleeval>=1.0.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.7",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
    "factory-boy>=3.3.0",
    "faker>=25.2.0",
    "ruff>=0.4.5",
    "mypy>=1.10.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

# ... (keep existing content) ...

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

# --- ADD THIS SECTION ---
[tool.hatch.build.targets.wheel]
packages = ["app"]
